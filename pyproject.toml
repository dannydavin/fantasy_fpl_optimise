[project]
name = "fpl"
version = "0.1.0"
description = "Personal FPL decision toolkit: data ingest, top-10k ownership, xP model, MILP transfer optimiser, Streamlit app"
readme = "README.md"
authors = [
    { name = "dannydavin", email = "dan.m.vincent@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "feedparser>=6.0.14",
    "highspy>=1.15.1",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pulp>=4.0.0",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["external", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: hits the live FPL API (deselected by default)"]
